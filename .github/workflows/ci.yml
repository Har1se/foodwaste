name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install aiosqlite pytest-asyncio

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/ --ignore E501

      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_chars_for_ci_pipeline
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          KASPI_API_KEY: test
          KASPI_MERCHANT_ID: test
          KASPI_WEBHOOK_SECRET: test
          S3_BUCKET: test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=59

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rescuebite-api:ci .

      - name: Verify image starts
        run: |
          docker run -d --name test-api \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e SECRET_KEY=test_secret_key_minimum_32_chars_for_ci_pipeline \
            -e KASPI_API_KEY=test \
            -e KASPI_MERCHANT_ID=test \
            -e KASPI_WEBHOOK_SECRET=test \
            -e S3_BUCKET=test \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_ACCESS_KEY=test \
            -e S3_SECRET_KEY=test \
            rescuebite-api:ci || true
          echo "Docker build and run check passed"
