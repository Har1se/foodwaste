version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rescuebite
      POSTGRES_PASSWORD: rescuebite
      POSTGRES_DB: rescuebite_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuebite -d rescuebite_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly yes ensures refresh tokens survive a Redis restart
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI App ─────────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rescuebite:rescuebite@db:5432/rescuebite_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: rescuebite_dev_secret_key_do_not_use_in_production_x9k2
      ACCESS_TOKEN_EXPIRE_MINUTES: "43200"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      KASPI_API_KEY: dev_placeholder
      KASPI_MERCHANT_ID: dev_placeholder
      KASPI_WEBHOOK_SECRET: dev_placeholder
      S3_BUCKET: rescuebite-media
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: dev_placeholder
      S3_SECRET_KEY: dev_placeholder
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@rescuebite.kz
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
      DEBUG: "true"
      ENABLE_RATE_LIMIT: "true"
      DEV_AUTO_VERIFY_EMAIL: "true"
      DEV_AUTO_APPROVE_VENDORS: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000","https://rescuebite.deployrocks.com","https://rescuebite-api.deployrocks.com"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://rescuebite:rescuebite@db:5432/rescuebite_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: rescuebite_dev_secret_key_do_not_use_in_production_x9k2
      KASPI_API_KEY: dev_placeholder
      KASPI_MERCHANT_ID: dev_placeholder
      KASPI_WEBHOOK_SECRET: dev_placeholder
      S3_BUCKET: rescuebite-media
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: dev_placeholder
      S3_SECRET_KEY: dev_placeholder
      # FIX: SMTP vars were missing — email tasks silently failed in worker
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@rescuebite.kz
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
      ENABLE_RATE_LIMIT: "false"
      DEV_AUTO_VERIFY_EMAIL: "true"
      DEV_AUTO_APPROVE_VENDORS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Celery Beat (scheduler) ─────────────────────────────────────────────────
  beat:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://rescuebite:rescuebite@db:5432/rescuebite_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: rescuebite_dev_secret_key_do_not_use_in_production_x9k2
      KASPI_API_KEY: dev_placeholder
      KASPI_MERCHANT_ID: dev_placeholder
      KASPI_WEBHOOK_SECRET: dev_placeholder
      S3_BUCKET: rescuebite-media
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: dev_placeholder
      S3_SECRET_KEY: dev_placeholder
      # FIX: SMTP vars were missing — email tasks silently failed in beat-spawned tasks
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@rescuebite.kz
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
    # FIX: beat depends on db — price_decay and auction_tasks need the database.
    # Old config only depended on redis, causing first tasks to fail on slow DB start.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

volumes:
  postgres_data:
  redis_data:
