version: "3.9"

# All secret/config values come from environment variables.
# For local development: copy .env.example → .env and fill in values.
# For DeployRocks: set variables in the platform dashboard.
#
# IMPORTANT: networks section is explicit so Dokku/DeployRocks creates
# the bridge network before starting any containers (avoids race condition).

networks:
  default:
    driver: bridge

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescuebite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuebite}
      POSTGRES_DB: ${POSTGRES_DB:-rescuebite_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescuebite} -d ${POSTGRES_DB:-rescuebite_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${PORT:-8000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rescuebite:rescuebite@postgres:5432/rescuebite_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rescuebite.kz}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rescuebite.kz}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      DEV_AUTO_VERIFY_EMAIL: ${DEV_AUTO_VERIFY_EMAIL:-true}
      DEV_AUTO_APPROVE_VENDORS: ${DEV_AUTO_APPROVE_VENDORS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      KASPI_API_KEY: ${KASPI_API_KEY:-dev_placeholder}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-dev_placeholder}
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-dev_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # PORT is set by Dokku; falls back to 8000 for local docker compose
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rescuebite:rescuebite@postgres:5432/rescuebite_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rescuebite.kz}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rescuebite.kz}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      KASPI_API_KEY: ${KASPI_API_KEY:-dev_placeholder}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-dev_placeholder}
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-dev_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

  # ── Celery Beat (scheduler) ─────────────────────────────────────────────────
  beat:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rescuebite:rescuebite@postgres:5432/rescuebite_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@rescuebite.kz}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rescuebite.kz}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      KASPI_API_KEY: ${KASPI_API_KEY:-dev_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule

  # ── Flower (Celery task monitor) ─────────────────────────────────────────────
  flower:
    build: .
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rescuebite:rescuebite@postgres:5432/rescuebite_db}
      SECRET_KEY: ${SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-rescuebite_dev_key_minimum_32chars_long}
    depends_on:
      - redis
      - worker
    command: celery -A app.tasks.celery_app.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
